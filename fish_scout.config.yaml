# 钓了嘛鱼情侦察配置。小红书/抖音/公众号只收公开摘要或手动链接，不登录抓站。
storage:
  output_dir: "./fish_scout_data"
  db_name: "fish_scout.db"
  report_dir: "reports"
  post_archive_dir: "posts"

selected_locations:
  - "上海"
  - "北京"

locations:
